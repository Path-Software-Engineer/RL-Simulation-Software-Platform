[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-simulation-runner"
version = "0.3.0"
description = "Allowlisted Gridworld, DQN and world-model runner for the RL Simulation Control Platform"
requires-python = ">=3.12,<3.13"
dependencies = ["redis==6.4.0"]

[project.scripts]
rl-runner = "rl_runner.consumer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
