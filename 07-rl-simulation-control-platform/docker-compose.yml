name: rl-simulation-control-platform

services:
  timescaledb:
    image: timescale/timescaledb:2.29.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rl_control}
      POSTGRES_USER: ${POSTGRES_USER:-rl_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_rl_password}
    ports:
      - "${POSTGRES_PORT:-5447}:5432"
    volumes:
      - rl-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: timescale/timescaledb:2.29.0-pg17
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_rl_password}
    volumes:
      - ./database/migrations:/migrations:ro
    command: ["psql", "-h", "timescaledb", "-U", "${POSTGRES_USER:-rl_control}", "-d", "${POSTGRES_DB:-rl_control}", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/0001_sprint_01_gridworld.up.sql", "-f", "/migrations/0002_sprint_02_dqn_dashboard.up.sql"]
    restart: "no"

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6387}:6379"
    volumes:
      - rl-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: infra/docker/control-api.Dockerfile
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-rl_control}:${POSTGRES_PASSWORD:-local_rl_password}@timescaledb:5432/${POSTGRES_DB:-rl_control}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-token-change-me}
      COMMAND_STREAM: rl.commands.v1
      EVENT_STREAM: rl.events.v1
      ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-3000},http://localhost:${WEB_PORT:-3000}
      OPENAPI_PATH: /app/contracts/http/openapi.json
      LOG_LEVEL: INFO
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  rl-runner:
    build:
      context: .
      dockerfile: infra/docker/rl-runner.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      COMMAND_STREAM: rl.commands.v1
      EVENT_STREAM: rl.events.v1
      DEAD_LETTER_STREAM: rl.dead-letter.v1
      RUNNER_CONSUMER_GROUP: rl-runner-v1
      POLICY_ARTIFACT_ROOT: /workspace/artifacts/policies
      RUNNER_STEP_DELAY_MS: ${RUNNER_STEP_DELAY_MS:-120}
      DQN_STEP_DELAY_MS: ${DQN_STEP_DELAY_MS:-10}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      control-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:${API_PORT:-8080}
      NUXT_PUBLIC_WS_BASE: ws://127.0.0.1:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  rl-timescale-data:
  rl-redis-data:
