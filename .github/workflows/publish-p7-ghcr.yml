name: Publish Project 07 GHCR images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-p7-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/path-software-engineer/rl-simulation-control-platform
  PROJECT_ROOT: 07-rl-simulation-control-platform

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-api
            dockerfile: infra/docker/control-api.Dockerfile
          - image: rl-runner
            dockerfile: infra/docker/rl-runner.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: migrate
            dockerfile: infra/docker/migrate.Dockerfile
          - image: gateway
            dockerfile: infra/docker/gateway.Dockerfile
    steps:
      - name: Check out the selected immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve immutable image tag
        id: identity
        shell: bash
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ env.PROJECT_ROOT }}
          file: ${{ env.PROJECT_ROOT }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ steps.identity.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Project 07 ${{ matrix.image }}

      - name: Record published identity
        shell: bash
        run: |
          echo "### Published ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ steps.identity.outputs.tag }}' >> "$GITHUB_STEP_SUMMARY"
